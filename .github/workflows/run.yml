name: market signal

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Upgrade pip
      run : python -m pip install --upagrade pip

    - name: Install packages
      run: pip install -r requirements.txt

    - name: Run script
      run: python signal.py
